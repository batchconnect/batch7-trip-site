<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Committee login setup</title>
<style>
body{margin:0;min-height:100vh;background:#050d1a;color:#e8eef6;font:16px/1.6 system-ui,sans-serif;display:grid;place-items:center;padding:20px}
main{width:min(560px,100%);padding:28px;border-radius:22px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14)}
h1{margin:0 0 6px;font-size:1.5rem}
p{color:#9fb0c6;margin:6px 0 14px}
label{display:block;font-weight:600;margin:14px 0 4px}
input,textarea{width:100%;font:inherit;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#e8eef6}
textarea{min-height:120px;font:12px/1.4 ui-monospace,monospace;word-break:break-all}
button{margin-top:16px;padding:11px 24px;border:0;border-radius:999px;background:linear-gradient(135deg,#5ee0d0,#7fb2ff);color:#04121f;font:600 1rem system-ui;cursor:pointer}
#msg{margin-left:10px;color:#9fb0c6}
</style>
</head>
<body>
<main>
<h1>Committee login setup</h1>
<p>Run this once. Nothing is sent anywhere: the code is made inside your browser.</p>
<label for="pw">Committee password</label>
<input id="pw" type="password" autocomplete="off">
<label for="tk">GitHub token (the one for your data repo)</label>
<input id="tk" type="password" autocomplete="off">
<button id="go" type="button">Create code</button><span id="msg"></span>
<label for="out">Your code</label>
<textarea id="out" readonly></textarea>
<button id="copy" type="button">Copy code</button>
<p>Paste it into index.html as the value of <b>enc</b>, between the quotes. Then delete this file from your repo.</p>
</main>
<script>
function b64(u){var s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
document.getElementById("go").onclick=async function(){
  var pw=document.getElementById("pw").value.trim(),tk=document.getElementById("tk").value.trim(),m=document.getElementById("msg");
  if(!pw||!tk){m.textContent="Fill in both boxes.";return}
  try{
    var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
    var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:300000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt"]);
    var ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,new TextEncoder().encode(tk)));
    var all=new Uint8Array(28+ct.length);all.set(salt,0);all.set(iv,16);all.set(ct,28);
    document.getElementById("out").value=b64(all);m.textContent="Done."
  }catch(e){m.textContent="Your browser blocked this. Open the page from your https GitHub link."}
};
document.getElementById("copy").onclick=function(){var o=document.getElementById("out");o.select();try{navigator.clipboard.writeText(o.value)}catch(e){document.execCommand("copy")}};
</script>
</body>
</html>

  h+='<section class="pg"><h2 class="sh">Rules and safety</h2><ul class="rules"><li>Stay with your group. Tell a committee member before leaving it.</li><li>Be back at the bus on time at every stop.</li><li>Do not swim at the beach without a committee member watching. Currents can be strong.</li><li>Keep valuables and your phone close in the fort and on the ramparts.</li><li>Drink water and wear sun protection.</li><li>Keep the bus tidy. Take your rubbish with you.</li><li>No alcohol or smoking on the trip.</li><li>Respect residents and places of worship in the fort.</li><li>Keep your phone charged and answer calls from the committee.</li></ul></section>';
  h+='<section class="pg"><div class="sos"><h2 class="sh">Emergency contacts</h2><div class="num bg"><span>Police emergency</span><a href="tel:119">119</a></div><div class="num bg"><span>Ambulance (Suwa Seriya)</span><a href="tel:1990">1990</a></div>'+contacts()+'</div></section>';
  if(ADMIN){h+='<div class="board" data-admin><h2>Notice board (committee only)</h2><div class="notes">'
    +'<div class="note n1"><h3>What are we doing?</h3><label for="f-stop">Current location or activity</label><select id="f-stop">'+STOPS.map(function(s,i){return'<option value="'+i+'">'+s.n+'</option>'}).join("")+'</select><label for="f-note">Short note</label><input id="f-note"><p>Tip: you can also tap a stop on the map.</p></div>'
    +'<div class="note n2"><h3>Message to everyone</h3><label for="f-msg">Shows in "From the committee"</label><textarea id="f-msg" rows="4"></textarea></div>'
    +'<div class="note n3 wide"><h3>Bus details</h3>';
    for(var b=0;b<3;b++)h+='<div class="c4"><input id="b'+b+'l" placeholder="Label, e.g. Bus 1" aria-label="Bus '+(b+1)+' label"><input id="b'+b+'p" placeholder="Number plate" aria-label="Bus '+(b+1)+' number plate"><input id="b'+b+'n" placeholder="Note (optional)" aria-label="Bus '+(b+1)+' note"></div>';
    h+='</div><div class="note n4"><h3>Trip details</h3><label for="f-date">Date</label><input id="f-date"><label for="f-meet">Meeting point</label><input id="f-meet"><label for="f-dep">Departure time</label><input id="f-dep"></div>'
    +'<div class="note n5"><h3>Who is coming</h3><label for="f-mem">One name per line</label><textarea id="f-mem" rows="7"></textarea></div>'
    +'<div class="note n6 wide"><h3>Emergency contacts</h3>';
    for(var i=0;i<4;i++)h+='<div class="c4"><input id="c'+i+'n" placeholder="Name" aria-label="Contact '+(i+1)+' name"><input id="c'+i+'r" placeholder="Role" aria-label="Contact '+(i+1)+' role"><input id="c'+i+'p" placeholder="Phone" inputmode="tel" aria-label="Contact '+(i+1)+' phone"></div>';
    h+='</div></div></div>'}
  h+='<footer>'+(ADMIN?'<button class="tag alt" id="logout" type="button">Lock committee mode</button>':'<details><summary>Committee login</summary><p>Enter the committee password.</p><input type="password" id="pw" inputmode="numeric" autocomplete="off" aria-label="Committee password"> <button class="tag" id="unlock" type="button">Unlock</button> <span id="tkm"></span></details>')+'</footer></main>';
  h+='<nav class="nav" aria-label="Quick links"><a href="#top"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a><a href="#roll-sec"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Roll call</a><a href="#route"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Route</a><button class="bus" id="navbus" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 11h16M8 21v-4M16 21v-4"/></svg>Bus</button></nav>';
  h+='<div class="sheet" id="sheet" hidden><div class="scrim" data-close="1"></div><div class="panel" role="dialog" aria-modal="true" aria-label="Bus details"><div class="grab"></div><h2>Bus details</h2><div id="buslist"></div><button class="tag alt" id="busclose" type="button" data-close="1">Close</button></div></div>';
  h+='<div class="savebar" id="sb" hidden><span id="sbm"></span><button class="tag" id="save" type="button">Save and publish</button></div>';

  $("sheet").onclick=function(e){var t=e.target;if(t.dataset&&t.dataset.close)closeBus();var c=t.dataset&&t.dataset.copy;if(c){try{navigator.clipboard.writeText(c);t.textContent="Copied ✓"}catch(x){t.textContent=c}}};

    for(var k in v)$(k).value=v[k];
    S.contacts.forEach(function(c,i){$("c"+i+"n").value=c.n;$("c"+i+"r").value=c.r;$("c"+i+"p").value=c.p});
    S.buses.forEach(function(x,i){$("b"+i+"l").value=x.l;$("b"+i+"p").value=x.p;$("b"+i+"n").value=x.n});
    $("save").onclick=save;$("logout").onclick=logout;
    $("f-mem").addEventListener("input",drawRoll);
    $("f-stop").addEventListener("change",function(){setStop(+$("f-stop").value)});
    document.querySelectorAll("[data-admin]").forEach(function(b){b.addEventListener("input",function(e){if(e.target.id!=="rl")mark()})});
  }else if($("unlock")){$("unlock").onclick=unlock;$("pw").addEventListener("keydown",function(e){if(e.key==="Enter")unlock()})}
  var rl=$("roll");
  rl.onclick=function(e){var t=e.target,b=t.closest&&t.closest("[data-rc]");
    if(b){RC=+b.dataset.rc;drawRoll();return}
    if(ADMIN&&t.dataset&&t.dataset.all!=null){ATT[RC].p=t.dataset.all==="1"?members().slice():[];drawRoll();mark()}};
  if(ADMIN){rl.onchange=function(e){var t=e.target;if(t.dataset.n==null)return;var p=ATT[RC].p,i=p.indexOf(t.dataset.n);if(t.checked&&i<0)p.push(t.dataset.n);if(!t.checked&&i>-1)p.splice(i,1);drawRoll();mark()};
    rl.oninput=function(e){if(e.target.id==="rl"){ATT[RC].l=e.target.value;mark()}}}
  drawRoll();
  var cc=document.querySelector("#stops li.cur"),st=$("stops");if(cc&&st)st.scrollTop=Math.max(0,cc.offsetTop-st.clientHeight/2+10)
}
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&$("sheet")&&!$("sheet").hidden)closeBus()});
function fromB64(c){var b=atob(c.replace(/\n/g,"")),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new TextDecoder().decode(u)}
function toB64(s){var u=new TextEncoder().encode(s),b="";for(var i=0;i<u.length;i++)b+=String.fromCharCode(u[i]);return btoa(b)}
function hdr(x){var h={"Accept":"application/vnd.github+json"};if(TOKEN)h.Authorization="Bearer "+TOKEN;for(var k in x)h[k]=x[k];return h}
function apply(d){if(!d||!d.att)return;S=dflt(d);if(S.stop>=STOPS.length)S.stop=0;ATT=clone(S.att);render()}
async function load(){
  if(ADMIN&&DIRTY)return;
  try{
    if(cfgOK()){
      var r=await fetch(API+"?ref="+CFG.branch,{headers:hdr(ETAG?{"If-None-Match":ETAG}:{}),cache:"no-store"});
      if(r.status===304)return;
      if(r.ok){var j=await r.json();ETAG=r.headers.get("ETag");SHA=j.sha;apply(JSON.parse(fromB64(j.content)));return}
    }
    var r2=await fetch("data.json?"+Date.now(),{cache:"no-store"});if(r2.ok)apply(await r2.json())
  }catch(e){}
}
function collect(){
  var g=function(i){return $(i).value.trim()},now=new Date().toLocaleString("en-GB",{timeZone:"Asia/Colombo",day:"numeric",month:"short",hour:"numeric",minute:"2-digit",hour12:true});
  S.msg=g("f-msg");S.stop=+g("f-stop");S.note=g("f-note");S.date=g("f-date");S.meet=g("f-meet");S.depart=g("f-dep");
  S.members=g("f-mem").split("\n").map(function(x){return x.trim()}).filter(Boolean);
  S.contacts=[0,1,2,3].map(function(i){return{n:g("c"+i+"n"),r:g("c"+i+"r"),p:g("c"+i+"p")}});
  S.buses=[0,1,2].map(function(i){return{l:g("b"+i+"l"),p:g("b"+i+"p"),n:g("b"+i+"n")}});
  var old=S.att;S.att=ATT.map(function(a,i){var o=old[i]||{p:[],t:""},p=a.p.filter(function(x){return S.members.indexOf(x)>-1});
    return{l:a.l.trim(),p:p,t:(JSON.stringify(p)!==JSON.stringify(o.p))?now:o.t}});
  S.updated=now
}
async function save(){
  var m=$("sbm");m.textContent="Saving...";
  try{
    collect();
    var body={message:"Update trip page",content:toB64(JSON.stringify(S,null,1)),branch:CFG.branch};
    for(var t=0;t<2;t++){
      if(SHA===null){var q=await fetch(API+"?ref="+CFG.branch,{headers:hdr({}),cache:"no-store"});SHA=q.ok?(await q.json()).sha:undefined}
      if(SHA)body.sha=SHA;else delete body.sha;
      var r=await fetch(API,{method:"PUT",headers:hdr({"Content-Type":"application/json"}),body:JSON.stringify(body)});
      if(r.ok){var j=await r.json();SHA=j.content.sha;ETAG=null;DIRTY=false;ATT=clone(S.att);render();$("sb").hidden=false;$("sbm").textContent="Saved ✓";setTimeout(function(){if(!DIRTY)$("sb").hidden=true},2500);return}
      if(r.status===409||r.status===422){SHA=null;continue}
      m.textContent=r.status===401||r.status===403||r.status===404?"This key cannot edit the repo. Lock and unlock again.":"Could not save ("+r.status+")";return
    }
    m.textContent="Could not save. Please try again."
  }catch(e){m.textContent="Could not save. Check your connection."}
}
function b64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function openToken(pw){
  var u=b64d(CFG.enc),km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u.slice(0,16),iterations:300000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(16,28)},key,u.slice(28)))
}
async function unlock(){
  var m=$("tkm"),p=$("pw").value.trim();
  if(!cfgOK()||!CFG.enc){m.textContent="Committee login is not set up yet.";return}
  m.textContent="Checking...";var t;
  try{t=await openToken(p)}catch(e){m.textContent="Wrong password.";return}
  try{
    var r=await fetch("https://api.github.com/repos/"+CFG.owner+"/"+CFG.repo,{headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+t}});
    var j=r.ok?await r.json():null;
    if(j&&(!j.permissions||j.permissions.push)){TOKEN=t;ADMIN=true;SHA=null;ETAG=null;await load();render()}
    else m.textContent="Setup problem: the saved key no longer works. Make a new one."
  }catch(e){m.textContent="Could not reach GitHub."}
}
function logout(){TOKEN=null;ADMIN=false;DIRTY=false;render()}
render();
load();
setInterval(load,60000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)load()});
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#050d1a">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Batch 7 · Galle Trip</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏝️%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#050d1a;--ink:#e8eef6;--mute:#9fb0c6;--line:rgba(255,255,255,.12);--aqua:#5ee0d0;--blue:#4c8dff;--amber:#ffc66b;--green:#34d399;--red:#ff6b6b;
--sea:#6fd3e6;--sea2:#0d3547;--sea3:#08222f;--land:#2e6b66;--land2:#1f5558;--relief:#58a98c;--sun:#ffc66b;--card:#0b1f33;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16.5px/1.65 Inter,system-ui,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 50% at 85% 5%,rgba(76,141,255,.28),transparent 70%),radial-gradient(55% 45% at 5% 20%,rgba(94,224,208,.18),transparent 70%),radial-gradient(70% 50% at 50% 100%,rgba(120,80,255,.16),transparent 70%)}
main{max-width:860px;margin:0 auto;padding:0 20px 110px}
h1,h2,h3{font-family:Sora,Inter,sans-serif;margin:0}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid var(--line);border-radius:22px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.status{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:20;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px 12px;width:fit-content;max-width:calc(100% - 24px);margin:10px auto 0;padding:9px 20px;border-radius:999px;background:rgba(8,20,38,.78);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font:600 .88rem Inter,sans-serif;text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
.status small{color:var(--mute);font-weight:400;font-size:.78rem}
.dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(52,211,153,.7);animation:blink 1.6s ease-out infinite}
@keyframes blink{0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}100%{box-shadow:0 0 0 10px rgba(52,211,153,0)}}
.mast{padding:70px 20px 40px}
.mast .in{max-width:820px;margin:0 auto}
.mast h1{font:700 clamp(4.4rem,18vw,8.6rem)/.9 Sora,sans-serif;letter-spacing:-.05em;background:linear-gradient(180deg,#fff 30%,#8fb6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:16px 0 0;color:var(--mute);font-size:1.05rem}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:34px 0 0}
.facts div{padding:16px 18px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.facts dt{font-size:.8rem;color:var(--aqua)}
.facts dd{margin:2px 0 0;font-weight:600}
@media(max-width:620px){.facts{grid-template-columns:1fr}}
.letter{max-width:860px;margin:0 auto;padding:0 20px}
.sheet2{position:relative;padding:34px 36px 26px;border-radius:26px;background:linear-gradient(135deg,rgba(255,198,107,.17),rgba(255,255,255,.04) 60%);border:1px solid rgba(255,198,107,.5);box-shadow:0 0 60px -20px rgba(255,198,107,.45),inset 0 1px 0 rgba(255,255,255,.12);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
@media(max-width:560px){.sheet2{padding:26px 22px 22px}}
.sheet2 h2{display:flex;align-items:center;gap:10px;font:600 .95rem Inter,sans-serif;color:var(--amber);margin:0 0 14px}
.sheet2 h2 svg{width:20px;height:20px}
.nmsg{margin:0;font:600 clamp(1.4rem,4.4vw,2.1rem)/1.35 Sora,sans-serif;letter-spacing:-.01em;white-space:pre-line}
.sheet2 small{display:block;margin-top:18px;color:var(--mute);font-size:.82rem}
.roll{max-width:860px;margin:26px auto 0;padding:0 20px}
.rin{padding:30px 30px 26px}
@media(max-width:560px){.rin{padding:24px 18px 20px}}
.roll h2{font:700 clamp(1.8rem,6vw,2.4rem) Sora,sans-serif;letter-spacing:-.02em}
.seg{display:inline-flex;gap:2px;margin:16px 0 22px;padding:4px;border-radius:999px;background:rgba(255,255,255,.07);max-width:100%;overflow-x:auto}
.seg button{padding:8px 16px;border:0;border-radius:999px;background:none;color:var(--mute);font:600 .88rem Inter,sans-serif;cursor:pointer;line-height:1.25;text-align:center;white-space:nowrap}
.seg button small{display:block;font-weight:400;font-size:.75rem;opacity:.85}
.seg button[aria-pressed=true]{background:linear-gradient(135deg,var(--aqua),#7fb2ff);color:#04121f}
.rc{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.ring{flex:none}
.rt{flex:1;min-width:200px}
.big{margin:0;font:600 1.25rem Sora,sans-serif}
.all{color:var(--green)}
.rt small{color:var(--mute)}
.rtools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 0}
.rtools input{flex:1;min-width:170px;font:inherit;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink)}
.tag{padding:10px 22px;border:0;border-radius:999px;background:linear-gradient(135deg,var(--aqua),#7fb2ff);color:#04121f;font:600 .9rem Inter,sans-serif;cursor:pointer}
.tag.alt{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:24px}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);transition:background .2s,border-color .2s}
.row.adm{cursor:pointer}
.row input{position:absolute;opacity:0;pointer-events:none}
.box{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);display:grid;place-items:center}
.row.on{background:rgba(52,211,153,.13);border-color:rgba(52,211,153,.55)}
.row.on .box{background:var(--green);border-color:var(--green)}
.row.on .box::after{content:"";width:6px;height:11px;border:solid #04121f;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.row input:focus-visible+.box{outline:3px solid var(--amber);outline-offset:2px}
.empty{padding:20px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--mute)}
section.pg{padding:56px 0 0}
h2.sh{font:700 1.7rem Sora,sans-serif;letter-spacing:-.02em;margin-bottom:18px}
.card{padding:20px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid var(--line)}
.live{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:700px){.live{grid-template-columns:auto 1fr}}
.maps{display:flex;gap:10px;align-items:flex-start;justify-content:center}
.maps svg{border-radius:18px;border:1px solid var(--line);height:auto;display:block;background:var(--sea2);box-shadow:0 20px 40px -24px #000}
.maps .a{width:34%;max-width:140px}.maps .b{width:62%;max-width:270px}
.zm.tap{cursor:crosshair;outline:2px dashed var(--amber);outline-offset:3px}
.pulse{fill:var(--red);animation:p 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes p{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(3.4)}}
@media(prefers-reduced-motion:reduce){.pulse,.dot{animation:none}}
.now{font:700 1.45rem/1.15 Sora,sans-serif;margin:0 0 4px}
.card small{color:var(--mute)}
.stops{list-style:none;margin:16px 0 0;padding:0 0 0 18px;border-left:1px solid var(--line)}
.stops li{position:relative;padding:2px 0 8px 14px;opacity:.5}
.stops li::before{content:"";position:absolute;left:-23px;top:10px;width:9px;height:9px;border-radius:50%;background:#44566e;border:2px solid var(--bg)}
.stops li.done{opacity:1}.stops li.done::before{background:var(--aqua)}
.stops li.cur{opacity:1;font-weight:600}.stops li.cur::before{background:var(--red);box-shadow:0 0 10px var(--red)}
ul.rules{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;counter-reset:r}
ul.rules li{counter-increment:r;position:relative;padding:16px 16px 16px 54px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:.96rem}
ul.rules li::before{content:counter(r);position:absolute;left:16px;top:14px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(94,224,208,.15);color:var(--aqua);font:600 .8rem Sora,sans-serif}
.sos{padding:24px;border-radius:22px;background:linear-gradient(135deg,rgba(255,107,107,.16),rgba(255,255,255,.03));border:1px solid rgba(255,107,107,.5)}
.sos h2{color:#ff9a9a}
.num{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 0;border-top:1px solid var(--line)}
.num a{color:var(--ink);font-weight:600;text-decoration:none;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.08)}
.bg a{font:700 1.5rem Sora,sans-serif;color:#ff9a9a;background:rgba(255,107,107,.14)}
footer{margin-top:56px;font-size:.9rem;color:var(--mute)}
footer summary{cursor:pointer}
footer input{font:inherit;padding:10px 16px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.06);color:var(--ink);width:min(260px,100%)}
/* admin board */
.board{margin-top:40px;padding:20px;border:12px solid #6e4a28;border-radius:8px;background:#b98a5a radial-gradient(rgba(0,0,0,.14) 1.2px,transparent 1.4px) 0 0/9px 9px;box-shadow:inset 0 0 30px rgba(0,0,0,.35);color:#2b2400}
.board h2{font:700 2.2rem Caveat,cursive;text-align:center;color:#fff8e6;text-shadow:0 2px 3px rgba(0,0,0,.5);margin-bottom:22px}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:26px 22px}
.note{position:relative;padding:24px 14px 14px;box-shadow:2px 5px 9px rgba(0,0,0,.4);transform:rotate(-1.2deg)}
.note:nth-child(even){transform:rotate(1deg)}
.note::before{content:"";position:absolute;top:-7px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a80,#b3261e 70%);box-shadow:1px 3px 3px rgba(0,0,0,.45)}
.n1{background:#fff3a3}.n2{background:#ffd6e0}.n3{background:#cfe8ff}.n4{background:#d8f5c9}.n5{background:#ffe2b8}.n6{background:#e6dcff}
.wide{grid-column:1/-1}
.note h3{font:700 1.6rem/1 Caveat,cursive;margin:0 0 6px}
.note label{display:block;font-weight:600;font-size:.9rem;margin:10px 0 3px}
.note input,.note textarea,.note select{width:100%;font:inherit;color:#2b2400;padding:7px 8px;border:0;border-bottom:2px solid rgba(43,36,0,.45);background:rgba(255,255,255,.6);border-radius:3px}
.note p{margin:4px 0;font-size:.92rem}
.c4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:8px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;gap:14px;align-items:center;justify-content:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:#0d2f3c;color:#fbf7ee;box-shadow:0 -4px 14px rgba(0,0,0,.3)}
.savebar .tag{background:#e0bd78;color:#2b2400}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
</style>

    $("clr").onclick=function(){PEND=null;drawMaps();$("pst").textContent=" Pin removed (save to apply)";mark()};
    $("maps").onclick=function(e){var s=e.target.closest&&e.target.closest("svg.zm");if(!s)return;var r=s.getBoundingClientRect();
      PEND={x:+(ZM.ox+(e.clientX-r.left)/r.width*ZM.w/ZM.k).toFixed(4),y:+(ZM.oy-(e.clientY-r.top)/r.height*ZM.h/ZM.k).toFixed(4)};
      drawMaps();$("pst").textContent=" Pin placed (save to apply)";mark()};
    document.querySelectorAll("[data-admin]").forEach(function(b){b.addEventListener("input",function(e){if(e.target.id!=="rl")mark()})});
  }else if($("unlock")){$("unlock").onclick=unlock;$("pw").addEventListener("keydown",function(e){if(e.key==="Enter")unlock()})}
  var rl=$("roll");
  rl.onclick=function(e){var t=e.target,b=t.closest&&t.closest("[data-rc]");
    if(b){RC=+b.dataset.rc;drawRoll();return}
    if(ADMIN&&t.dataset&&t.dataset.all!=null){ATT[RC].p=t.dataset.all==="1"?members().slice():[];drawRoll();mark()}};
  if(ADMIN){rl.onchange=function(e){var t=e.target;if(t.dataset.n==null)return;var p=ATT[RC].p,i=p.indexOf(t.dataset.n);if(t.checked&&i<0)p.push(t.dataset.n);if(!t.checked&&i>-1)p.splice(i,1);drawRoll();mark()};
    rl.oninput=function(e){if(e.target.id==="rl"){ATT[RC].l=e.target.value;mark()}}}
  drawRoll()
}
function fromB64(c){var b=atob(c.replace(/\n/g,"")),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new TextDecoder().decode(u)}
function toB64(s){var u=new TextEncoder().encode(s),b="";for(var i=0;i<u.length;i++)b+=String.fromCharCode(u[i]);return btoa(b)}
function hdr(x){var h={"Accept":"application/vnd.github+json"};if(TOKEN)h.Authorization="Bearer "+TOKEN;for(var k in x)h[k]=x[k];return h}
function apply(d){if(!d||!d.att)return;S=d;ATT=clone(S.att);render()}
async function load(){
  if(ADMIN&&DIRTY)return;
  try{
    if(cfgOK()){
      var r=await fetch(API+"?ref="+CFG.branch,{headers:hdr(ETAG?{"If-None-Match":ETAG}:{}),cache:"no-store"});
      if(r.status===304)return;
      if(r.ok){var j=await r.json();ETAG=r.headers.get("ETag");SHA=j.sha;apply(JSON.parse(fromB64(j.content)));return}
    }
    var r2=await fetch("data.json?"+Date.now(),{cache:"no-store"});if(r2.ok)apply(await r2.json())
  }catch(e){}
}
function collect(){
  var g=function(i){return $(i).value.trim()},now=new Date().toLocaleString("en-GB",{timeZone:"Asia/Colombo",day:"numeric",month:"short",hour:"numeric",minute:"2-digit",hour12:true});
  S.msg=g("f-msg");S.stop=+g("f-stop");S.note=g("f-note");S.where=g("f-where");S.date=g("f-date");S.meet=g("f-meet");S.depart=g("f-dep");
  if(PEND!==undefined)S.pin=PEND;
  S.members=g("f-mem").split("\n").map(function(x){return x.trim()}).filter(Boolean);
  S.contacts=[0,1,2,3].map(function(i){return{n:g("c"+i+"n"),r:g("c"+i+"r"),p:g("c"+i+"p")}});
  var old=S.att;S.att=ATT.map(function(a,i){var o=old[i]||{p:[],t:""},p=a.p.filter(function(x){return S.members.indexOf(x)>-1});
    return{l:a.l.trim(),p:p,t:(JSON.stringify(p)!==JSON.stringify(o.p))?now:o.t}});
  S.updated=now
}
async function save(){
  var m=$("sbm");m.textContent="Saving...";
  try{
    collect();
    var body={message:"Update trip page",content:toB64(JSON.stringify(S,null,1)),branch:CFG.branch};
    for(var t=0;t<2;t++){
      if(SHA===null){var q=await fetch(API+"?ref="+CFG.branch,{headers:hdr({}),cache:"no-store"});SHA=q.ok?(await q.json()).sha:undefined}
      if(SHA)body.sha=SHA;else delete body.sha;
      var r=await fetch(API,{method:"PUT",headers:hdr({"Content-Type":"application/json"}),body:JSON.stringify(body)});
      if(r.ok){var j=await r.json();SHA=j.content.sha;ETAG=null;DIRTY=false;PEND=undefined;ATT=clone(S.att);render();$("sb").hidden=false;$("sbm").textContent="Saved ✓";setTimeout(function(){if(!DIRTY)$("sb").hidden=true},2500);return}
      if(r.status===409||r.status===422){SHA=null;continue}
      m.textContent=r.status===401||r.status===403||r.status===404?"This token cannot edit the repo. Log out and try again.":"Could not save ("+r.status+")";return
    }
    m.textContent="Could not save. Please try again."
  }catch(e){m.textContent="Could not save. Check your connection."}
}
function b64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function openToken(pw){
  var u=b64d(CFG.enc),km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u.slice(0,16),iterations:300000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(16,28)},key,u.slice(28)))
}
async function unlock(){
  var m=$("tkm"),p=$("pw").value.trim();
  if(!cfgOK()||!CFG.enc){m.textContent="Committee login is not set up yet.";return}
  m.textContent="Checking...";var t;
  try{t=await openToken(p)}catch(e){m.textContent="Wrong password.";return}
  try{
    var r=await fetch("https://api.github.com/repos/"+CFG.owner+"/"+CFG.repo,{headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+t}});
    var j=r.ok?await r.json():null;
    if(j&&(!j.permissions||j.permissions.push)){TOKEN=t;ADMIN=true;SHA=null;ETAG=null;await load();render()}
    else m.textContent="Setup problem: the saved key no longer works. Make a new one."
  }catch(e){m.textContent="Could not reach GitHub."}
}
function logout(){TOKEN=null;ADMIN=false;DIRTY=false;PEND=undefined;render()}
render();
load();
setInterval(load,60000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)load()});
</script>
